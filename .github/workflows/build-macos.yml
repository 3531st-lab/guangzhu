name: Build macOS Desktop App (.dmg)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/macos-desktop
      - feat/competition-upgrade-20261103
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            label: Apple-Silicon-M-Series
          - arch: x64
            runner: macos-15-intel
            label: Intel-Mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 for frontend & plugin checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend test suite on macOS
        run: node --test tests/desktop/*.test.mjs

      - name: Set up Python 3.12 for macOS backend test suite
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies & run macOS regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-macos.txt
          python -m pytest \
            tests/test_macos_support.py \
            tests/test_audit_20261111_regressions.py \
            tests/test_pvsyst_and_satmap.py \
            tests/test_catalog.py \
            tests/test_electrical.py \
            tests/test_yieldsim.py \
            -q

      - name: Build self-contained 光筑.app and .dmg (${{ matrix.arch }})
        run: |
          chmod +x scripts/build_macos_dmg.sh start-mac.command installer/macos/launch-fallback.sh
          bash scripts/build_macos_dmg.sh --arch "${{ matrix.arch }}"
          shasum -a 256 dist/installer/Guangzhu-Setup-*-macos-${{ matrix.arch }}.dmg | tee dist/installer/Guangzhu-Setup-0.3.0-macos-${{ matrix.arch }}.dmg.sha256

      - name: Upload macOS .dmg artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Guangzhu-Setup-macos-${{ matrix.arch }}-dmg
          path: |
            dist/installer/Guangzhu-Setup-*-macos-${{ matrix.arch }}.dmg
            dist/installer/Guangzhu-Setup-*-macos-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach .dmg to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/Guangzhu-Setup-*-macos-${{ matrix.arch }}.dmg
            dist/installer/Guangzhu-Setup-*-macos-${{ matrix.arch }}.dmg.sha256
