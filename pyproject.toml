[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guangzhu"
version = "0.1.0"
description = "光筑：屋顶光伏设计与验证计算"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-m 'not network'"
markers = ["network: explicit opt-in tests requiring public data services"]
